[project]
name = "melanoma"
version = "0.0.1"
description = "Clasificador educativo de lesiones cutáneas (triage asistido, no diagnóstico)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
# Grupo `core`: base de entrenamiento y evaluación (paquete `melanoma`). La API NO depende de él.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "pydantic>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# Grupo `train`: solo para entrenar. Nunca se instala en la imagen de la API.
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "lightning>=2.4",
    "albumentations>=1.4",
    "torchmetrics>=1.4",
    "scikit-learn>=1.5",
    "wandb>=0.18",
]

[dependency-groups]
# Grupo `api`: inferencia ONNX. Conjunto explícito y mínimo, INDEPENDIENTE de `core`:
# la imagen de la API no lleva pandas, hydra ni omegaconf. Prohibido torch, timm o
# lightning (lo vigila tests/test_api_dependency_isolation.py y el límite de 400 MB en CI).
# Se exporta con `uv export --only-group api --no-emit-project`.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "onnxruntime>=1.19",
    "pillow>=10.0",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melanoma"]

# Ruedas CPU de PyTorch en el lockfile. Para CUDA usar `make setup-gpu`,
# que reinstala torch/torchvision desde el índice CUDA sin tocar el lockfile.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/melanoma"]
