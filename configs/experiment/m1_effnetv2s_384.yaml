# @package _global_
# F3.2 — M1, candidato principal: EfficientNetV2-S (in21k→in1k) a 384 px.
# Todo lo demás es idéntico a B1 (grupo train/matrix); lote efectivo 32 × 4 = 128.
# Uso: python scripts/train.py +experiment=m1_effnetv2s_384 train.seed=0
experiment: m1

defaults:
  - override /model: effnetv2s_384
  - override /train: matrix

data:
  image_size: 384
  batch_size: 32
  sampler: none

train:
  accumulate_grad_batches: 4
