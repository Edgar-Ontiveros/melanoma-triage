# @package _global_
# F2.5 — Línea base B1: ResNet50 preentrenado en ImageNet, 224 px, fine-tuning completo.
# Los hiperparámetros de entrenamiento vienen del grupo train/matrix (compartidos con la matriz
# de F3); aquí solo el backbone, la resolución y el lote físico (× acumulación = 128).
# Uso: python scripts/train.py +experiment=b1_resnet50_224 train.seed=0
experiment: b1_pos_weight

defaults:
  - override /model: resnet50_224
  - override /train: matrix

data:
  image_size: 224
  batch_size: 128
  sampler: none

train:
  accumulate_grad_batches: 1
