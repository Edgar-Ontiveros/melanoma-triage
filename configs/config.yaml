# Config raíz. Compone data + model + train. Cualquier valor puede sobreescribirse
# desde la línea de comandos: `python scripts/train.py model=resnet50_224 train.lr=1e-4`,
# o con un experimento completo: `python scripts/train.py +experiment=b1_resnet50_224`.
defaults:
  - data: isic2020
  - model: effnetv2s_384
  - train: default
  - _self_

# Nombre del experimento (lo fijan configs/experiment/*.yaml; scripts/f2_report.py agrupa por él).
experiment: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
